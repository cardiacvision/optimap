[build-system]
requires = [
    "setuptools>=42",
    "wheel",
    "setuptools_scm>=6.2",
    "pybind11>=2.12,<3",
    "extension-helpers",
    "oldest-supported-numpy; python_version<='3.8'",
    "numpy>=2.0,<3; python_version>'3.8'",
]

build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "optimap/_version.py"
fallback_version = "0.1.0"

[tool.cibuildwheel]
# Match the Python versions advertised in setup.py; newer versions need dependency updates.
build = "cp3{8,9,10,11,12,13}-*"
archs = ["auto64"]  # 64-bit only
skip = "pp* *musllinux*"  # disable PyPy, musl-based wheels
# The PyPI scikit-video release still uses removed NumPy aliases. Keep this
# workaround in wheel tests until the video backend is replaced.
test-requires = [
    "pytest",
    "numpy<1.24; python_version < '3.10'",
    "scikit-video @ https://github.com/scikit-video/scikit-video/archive/refs/tags/v1.3.0.tar.gz ; python_version >= '3.10'",
]
test-command = "pytest {project}/tests"

[tool.ruff]
line-length = 120
extend-exclude = [
    "docs",
    "tests"
]

[tool.ruff.lint]
exclude = [
  "docs",
]
select = ['E', 'F', 'W', 'A', 'PLC', 'PLE', 'PLW', 'I', 'D', 'Q']
ignore = [
    "E501",  # line too long
    "PLW2901",  # loop variable overwritten
    "PLW0603",  # global statement
    "D401",
    "D205",
    "W293",  # blank line contains whitespace
    "W291",  # trailing whitespace
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-builtins]
builtins-allowed-modules = ["trace"]
