[build-system]
requires = [
    "setuptools>=42",
    "wheel",
    "setuptools_scm>=6.2",
    "pybind11>=3.1,<4",
    "extension-helpers",
    "numpy>=2.0,<3",
]

build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "optimap/_version.py"
fallback_version = "0.1.0"

[tool.cibuildwheel]
# Build standard CPython wheels for all supported Python versions.
build = "cp3{9,10,11,12,13,14,15}-*"
archs = ["auto64"]  # 64-bit only
skip = "*musllinux*"  # disable musl-based wheels; PyPy is not enabled
# The PyPI scikit-video release still uses removed NumPy aliases. Keep this
# workaround in wheel tests until the video backend is replaced.
test-requires = [
    "pytest",
    "https://github.com/scikit-video/scikit-video/archive/refs/tags/v1.3.0.tar.gz",
]
test-command = "pytest {project}/tests"
test-environment = { MPLBACKEND = "Agg" }

[[tool.cibuildwheel.overrides]]
select = "cp39-*"
test-requires = ["pytest", "numpy<1.24"]

# PyPI does not yet provide CPython 3.15 wheels for these dependencies.
# Install only these two nightly wheels before resolving the wheel's other deps.
[[tool.cibuildwheel.overrides]]
select = "cp315-*"
before-test = 'uv pip install --no-deps --only-binary=:all: --index-url=https://pypi.anaconda.org/scientific-python-nightly-wheels/simple "h5py>=3.17.0.dev0" "scikit-image>=0.27.0rc2.dev0"'

[tool.ruff]
line-length = 120
extend-exclude = [
    "docs",
    "tests"
]

[tool.ruff.lint]
exclude = [
  "docs",
]
select = ['E', 'F', 'W', 'A', 'PLC', 'PLE', 'PLW', 'I', 'D', 'Q']
ignore = [
    "E501",  # line too long
    "PLW2901",  # loop variable overwritten
    "PLW0603",  # global statement
    "D401",
    "D205",
    "W293",  # blank line contains whitespace
    "W291",  # trailing whitespace
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-builtins]
builtins-allowed-modules = ["trace"]
