name: Build, test and deploy to PyPI

on:
  workflow_dispatch:
    inputs:
      upload_pypi:
        description: 'Upload to PyPI?'
        required: true
        default: false
        type: boolean
  release:
    types:
      - published

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Use separate native runners to build and test both macOS architectures.
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-15]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_BUILD_FRONTEND: "build[uv]"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          path: ./wheelhouse/*.whl
          name: wheels-${{ matrix.os }}-${{ strategy.job-index }}
          if-no-files-found: error

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Build sdist
        run: pipx run build --sdist

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          path: dist/*.tar.gz
          name: wheels-sdist
          if-no-files-found: error

  upload_pypi:
    name: Upload to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'release' || github.event.inputs.upload_pypi == 'true' }}
    environment:
      name: pypi
      url: https://pypi.org/p/optimap
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
